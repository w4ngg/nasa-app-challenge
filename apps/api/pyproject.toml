[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "flame-atlas-api"
version = "0.1.0"
description = "API and metadata ingestion foundation for Flame Atlas"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.7",
  "pydantic==2.14.3",
  "python-dotenv==1.2.4",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.2.0"]

[project.scripts]
flame-ingest-psi = "flame_api.ingestion.psi:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
